[package]
name = "cockatiel-engine"
version = "0.1.0"
edition = "2024"
build = "../proto/build.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
turso = "0.1.0"

uuid = { version = "1.0", features = ["v7", "fast-rng"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

prost = "0.14"
jsonwebtoken = "*"
tokio-rustls = "0.26"

prost-build = "0.13"

ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

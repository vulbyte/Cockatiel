[package]
name = "cockatiel_local_server"
version = "0.1.0"
edition = "2021"
authors = ["vulbyte <vulbyt3@gmail.com>"]
build = "../proto/build.rs"

[dependencies]
colored = "3"

vulb_lib = { path = "./vulb_lib" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

turso = "0.7.2"

uuid = { version = "1.24.0", features = ["v7", "fast-rng"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

prost = "0.14.4"
jsonwebtoken = "11.0.0"
tokio-rustls = "0.26.4"

ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[build-dependencies]
prost-build = "0.14.4"

[package]
name = "term_display_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Adjust this relative path if lib_cockatiel is located elsewhere
lib-cockatiel = { path = "../../lib-cockatiel/rust" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.27"
tracing = "0.1"
tracing-subscriber = "0.3"
